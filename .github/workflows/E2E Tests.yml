name: E2E Tests

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - 'Documentation/**'
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Adgangskoder hentes fra GitHub Secrets (Actions + Dependabot). E2E_SQL_SERVER er ikke en hemmelighed.
    env:
      E2E_SQL_SERVER: localhost,1433
      E2E_SQL_SA_PASSWORD: ${{ secrets.E2E_SQL_SA_PASSWORD }}
      E2E_SQL_APP_USER_PASSWORD: ${{ secrets.E2E_SQL_APP_USER_PASSWORD }}
      E2E_SQL_ADMIN_USER_PASSWORD: ${{ secrets.E2E_SQL_ADMIN_USER_PASSWORD }}

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.E2E_SQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Verify required secrets
        run: |
          for v in E2E_SQL_SA_PASSWORD E2E_SQL_APP_USER_PASSWORD E2E_SQL_ADMIN_USER_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret '$v' mangler (Settings → Secrets and variables → Actions)."
              exit 1
            fi
          done

      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            (exec 3<>/dev/tcp/localhost/1433) 2>/dev/null && exec 3<&- && break
            echo "Venter på SQL Server... ($i)"
            sleep 2
          done
          sleep 5

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('MyGardenPlanner2026.Tests.E2E/MyGardenPlanner2026.Tests.E2E.csproj') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pwsh MyGardenPlanner2026.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pwsh MyGardenPlanner2026.Tests.E2E/bin/Release/net10.0/playwright.ps1 install-deps chromium

      - name: Run E2E tests
        run: dotnet test MyGardenPlanner2026.Tests.E2E/MyGardenPlanner2026.Tests.E2E.csproj --configuration Release --no-build
