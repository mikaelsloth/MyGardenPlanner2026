name: E2E Tests

on:
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest

    # Ephemer, engangsbrugs-container — adgangskoderne lever kun i denne jobkørsel.
    env:
      E2E_SQL_SERVER: localhost,1433
      E2E_SQL_SA_PASSWORD: E2eTest!Passw0rd
      E2E_SQL_APP_USER_PASSWORD: E2eApp!Passw0rd
      E2E_SQL_ADMIN_USER_PASSWORD: E2eAdmin!Passw0rd

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: E2eTest!Passw0rd
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            (exec 3<>/dev/tcp/localhost/1433) 2>/dev/null && exec 3<&- && break
            echo "Venter på SQL Server... ($i)"
            sleep 2
          done
          sleep 5

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Install Playwright browsers
        run: pwsh MyGardenPlanner2026.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run E2E tests
        run: dotnet test MyGardenPlanner2026.Tests.E2E/MyGardenPlanner2026.Tests.E2E.csproj --configuration Release --no-build