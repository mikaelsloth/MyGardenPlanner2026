name: PR Quality Gate

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    # Ephemer, engangsbrugs-container — samme mønster som E2E Tests.yml.
    env:
      MGP_TEST_SQLSERVER_CONNECTION: Server=localhost,1433;User Id=sa;Password=CiUnitTest!Passw0rd;TrustServerCertificate=True

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CiUnitTest!Passw0rd
        ports:
          - 1433:1433
          
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Vulnerability scan
        run: |
          output=$(dotnet list package --vulnerable --include-transitive)
          echo "$output"

          if echo "$output" | grep -q "has the following vulnerable packages"; then
            exit 1
          fi

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Check EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations has-pending-model-changes \
            --configuration Release --no-build \
            --project MyGardenPlanner2026.Infrastructure \
            --startup-project MyGardenPlanner2026/MyGardenPlanner2026

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            (exec 3<>/dev/tcp/localhost/1433) 2>/dev/null && exec 3<&- && break
            echo "Venter på SQL Server... ($i)"
            sleep 2
          done
          sleep 5

      - name: Test (Unit) with coverage
        run: dotnet test MyGardenPlanner2026.Tests.Unit/MyGardenPlanner2026.Tests.Unit.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura

      - name: Test (UI) with coverage
        run: dotnet test MyGardenPlanner2026.Tests.UI/MyGardenPlanner2026.Tests.UI.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura

      - name: Coverage summary
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"**/*cobertura*.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"MarkdownSummary"
          cat coveragereport/Summary.md >> $GITHUB_STEP_SUMMARY