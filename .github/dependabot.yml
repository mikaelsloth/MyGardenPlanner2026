version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      microsoft:
        patterns:
          - "Microsoft.*"

      aspnetcore:
        patterns:
          - "AspNetCore.*"

      testing:
        patterns:
          - "xunit*"
          - "coverlet*"
          - "Moq*"
          - "FluentAssertions*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      github-actions:
        patterns:
          - "*"
