name: Coverage

on:
  pull_request:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    env:
      MGP_TEST_SQLSERVER_CONNECTION: Server=localhost,1433;User Id=sa;Password=CiCoverage!Passw0rd;TrustServerCertificate=True

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: CiCoverage!Passw0rd
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            (exec 3<>/dev/tcp/localhost/1433) 2>/dev/null && exec 3<&- && break
            echo "Venter på SQL Server... ($i)"
            sleep 2
          done
          sleep 5

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test (Unit) with coverage
        run: dotnet test MyGardenPlanner2026.Tests.Unit/MyGardenPlanner2026.Tests.Unit.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura

      - name: Test (UI) with coverage
        run: dotnet test MyGardenPlanner2026.Tests.UI/MyGardenPlanner2026.Tests.UI.csproj --configuration Release --no-build --coverlet --coverlet-output-format cobertura

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool

          reportgenerator \
           -reports:"**/coverage.cobertura.xml" \
           -targetdir:"coveragereport" \
           -reporttypes:"Html;MarkdownSummary"