name: EF Core Migrations

on:
  pull_request:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check migrations
        run:
          dotnet tool install --global dotnet-ef    

          dotnet ef migrations has-pending-model-changes --project MyGardenPlanner2026.Infrastructure --startup-project MyGardenPlanner2026\MygardenPlanner2026
